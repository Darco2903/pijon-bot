name: pijon-bot
services:
  mysql-db:
    image: mysql:8
    command: --mysql-native-password=ON
    container_name: pijon-db
    restart: always
    ports:
      - "127.0.0.1:${DATABASE_PORT}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD}
      MYSQL_USER: ${DATABASE_USER}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD}
      MYSQL_DATABASE: ${DATABASE_NAME}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DATABASE_ROOT_PASSWORD}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: { context: ., target: migrate }
    image: pijon-bot-migrate:latest
    env_file: .env
    depends_on:
      mysql-db: { condition: service_healthy }

  pijon-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: pijon-bot:latest
    container_name: pijon-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./config.json:/app/config.json:ro
      - ./data:/app/data:rw
    depends_on:
      mysql-db:
        condition: service_healthy
      migrate: { condition: service_completed_successfully }

volumes:
  mysql-data:
